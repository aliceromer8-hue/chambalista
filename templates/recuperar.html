<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nueva contraseña — Chamba Lista</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/static/css/web.css">
</head>
<body>

<header class="cabecera">
  <div class="ancho">
    <a class="logo" href="/">
      <svg width="22" height="24" viewBox="0 0 24 26" fill="none" aria-hidden="true">
        <rect x="1.5" y="1.5" width="21" height="23" rx="2" stroke="currentColor" stroke-width="1.6"/>
        <line x1="6" y1="7.5" x2="18" y2="7.5" stroke="currentColor" stroke-width="1.6"/>
        <line x1="6" y1="12" x2="12" y2="12" stroke="currentColor" stroke-width="1.6"/>
        <line x1="6" y1="16" x2="12" y2="16" stroke="currentColor" stroke-width="1.6"/>
      </svg>
      Chamba Lista
    </a>
    <span class="detalle">Nueva contraseña</span>
  </div>
</header>

<main class="ancho paso" style="max-width:460px;margin-top:32px">
  <h1 style="font-size:1.4rem">Elige tu contraseña nueva</h1>

  <form id="form-clave" class="oculto">
    <label class="campo">
      <span>Contraseña nueva</span>
      <input type="password" id="clave" autocomplete="new-password" required
             minlength="8" placeholder="Al menos 8 caracteres">
    </label>
    <label class="campo">
      <span>Repítela</span>
      <input type="password" id="clave2" autocomplete="new-password" required minlength="8">
    </label>
    <p class="aviso-cuenta oculto" id="aviso"></p>
    <button class="boton principal ancho-total" id="enviar" type="submit">Guardar</button>
  </form>

  <p class="detalle" id="sin-enlace">
    Comprobando el enlace…
  </p>

  <p class="volver" style="margin-top:24px"><a href="/">← Volver a Chamba Lista</a></p>
</main>

<script src="/static/js/recuperar.js"></script>
</body>
</html>
